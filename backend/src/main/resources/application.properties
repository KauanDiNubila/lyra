spring.application.name=lyra
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.mvc.problemdetails.enabled=true
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
springdoc.api-docs.enabled=false
lyra.open-food-facts.base-url=https://world.openfoodfacts.org
lyra.open-food-facts.user-agent=Lyra/0.1 (https://github.com/KauanDiNubila/lyra)
lyra.open-food-facts.connect-timeout=2s
lyra.open-food-facts.read-timeout=4s
